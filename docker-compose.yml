# Local full stack: api + agents worker + executor worker + Postgres + Temporal dev server.  docker compose up --build
# Temporal UI: http://localhost:8233   App: http://localhost:8000
# Dev-only credentials below. Users: alice (requester), bob (approver), carol (both; cannot approve her own requests).
# Secret separation mirrors prod: ONLY api + executor have APPROVAL_SECRET; ONLY agents gets LLM keys; executor runs real
# terraform only when EXECUTE=1 (off by default) and needs TF_STATE_BUCKET + AWS credentials you provide.
x-common: &common
  build: .
  depends_on: {db: {condition: service_healthy}, temporal: {condition: service_started}}
services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: agents, POSTGRES_PASSWORD: agents, POSTGRES_DB: agents}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U agents"], interval: 3s, retries: 10}
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports: ["7233:7233", "8233:8233"]
  api:
    <<: *common
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://agents:agents@db:5432/agents
      TEMPORAL_ADDRESS: temporal:7233
      APPROVAL_SECRET: dev-only-approval-secret-change-me
      API_USERS: '{"dev-alice":{"user":"alice","roles":["requester"]},"dev-bob":{"user":"bob","roles":["approver"]},"dev-carol":{"user":"carol","roles":["requester","approver"]}}'
  agents:
    <<: *common
    command: python -m devops_agent.worker agents
    environment:
      DATABASE_URL: postgresql://agents:agents@db:5432/agents
      TEMPORAL_ADDRESS: temporal:7233
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  executor:
    <<: *common
    command: python -m devops_agent.worker executor
    environment:
      DATABASE_URL: postgresql://agents:agents@db:5432/agents
      TEMPORAL_ADDRESS: temporal:7233
      APPROVAL_SECRET: dev-only-approval-secret-change-me
      EXECUTE: ${EXECUTE:-0}
      TF_STATE_BUCKET: ${TF_STATE_BUCKET:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
