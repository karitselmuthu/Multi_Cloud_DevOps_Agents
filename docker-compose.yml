# Local full stack: app + worker + Postgres + Temporal dev server.  docker compose up --build
# Temporal UI: http://localhost:8233   App: http://localhost:8000
x-env: &env
  DATABASE_URL: postgresql://agents:agents@db:5432/agents
  TEMPORAL_ADDRESS: temporal:7233
services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: agents, POSTGRES_PASSWORD: agents, POSTGRES_DB: agents}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U agents"], interval: 3s, retries: 10}
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports: ["7233:7233", "8233:8233"]
  app:
    build: .
    ports: ["8000:8000"]
    environment: *env
    depends_on: {db: {condition: service_healthy}, temporal: {condition: service_started}}
  worker:
    build: .
    command: python -m devops_agent.worker
    environment: *env
    depends_on: {db: {condition: service_healthy}, temporal: {condition: service_started}}
