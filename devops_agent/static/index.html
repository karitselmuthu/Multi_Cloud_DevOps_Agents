<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevOps Agents</title>
<style>
body{font:15px system-ui;max-width:900px;margin:2rem auto;padding:0 1rem;color:#222}
input,select,textarea,button{font:inherit;padding:.4rem;margin:.2rem 0}
input,textarea{width:100%;box-sizing:border-box}
table{width:100%;border-collapse:collapse;margin-top:1rem}td,th{border-bottom:1px solid #ddd;padding:.4rem;text-align:left}
pre{background:#f5f5f5;padding:.6rem;overflow:auto;max-height:18rem}
.s{padding:.1rem .5rem;border-radius:1rem;background:#eee}.pending_approval{background:#ffe9a8}.applied,.pr_opened{background:#c8f0c8}.blocked,.failed{background:#f8c8c8}
</style></head><body>
<h1>Multi-Cloud DevOps Agents</h1>
<input id="key" type="password" placeholder="API key (if configured)">
<input id="title" placeholder="Title, e.g. Private S3 bucket for logs">
<textarea id="desc" rows="3" placeholder="What do you need?"></textarea>
<select id="cloud"><option>aws</option><option>azure</option></select>
<select id="kind"><option>terraform</option><option>kubernetes</option><option>github</option></select>
<button onclick="submitReq()">Submit request</button>
<table><thead><tr><th>#</th><th>Title</th><th>Cloud</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table>
<pre id="detail">Select a request to see agent output.</pre>
<script>
const h=()=>({'Content-Type':'application/json','X-API-Key':document.getElementById('key').value});
const api=(p,o={})=>fetch(p,{headers:h(),...o}).then(r=>r.ok?r.json():r.json().then(e=>Promise.reject(e.detail)));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
  try{const rs=await api('/requests');
  rows.innerHTML=rs.map(r=>`<tr><td>${r.id}</td><td>${esc(r.title)}</td><td>${esc(r.cloud)}</td>
  <td><span class="s ${esc(r.status)}">${esc(r.status)}</span></td><td>
  <button onclick="show(${r.id})">view</button>
  ${r.status=='pending_approval'?`<button onclick="act(${r.id},'approve')">approve</button>`:''}
  ${['pending_approval','blocked'].includes(r.status)?`<button onclick="act(${r.id},'reject')">reject</button>`:''}</td></tr>`).join('')}
  catch(e){detail.textContent='Error: '+e}}
async function submitReq(){await api('/requests',{method:'POST',body:JSON.stringify({title:title.value,description:desc.value,cloud:cloud.value,kind:kind.value})});load()}
async function act(id,a){try{await api(`/requests/${id}/${a}`,{method:'POST'})}catch(e){alert(e)}load()}
async function show(id){detail.textContent=JSON.stringify((await api('/requests/'+id)).outputs,null,2)}
load();setInterval(load,4000);
</script></body></html>
